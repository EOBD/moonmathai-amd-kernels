[build-system]
requires = ["setuptools>=61", "wheel", "torch==2.12.0+rocm7.2", "ninja"]
build-backend = "setuptools.build_meta"

[project]
name = "moonmath-amd"
version = "0.1.0"
description = "Hand-tuned kernels for AMD CDNA3 (MI300X: MHA forward, MLA decode, MXFP4 MoE) and CDNA4 (MI355X: bf16 attention forward, varlen, causal, GQA, MLA prefill)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch==2.12.0+rocm7.2",
]

[project.optional-dependencies]
bench = [
    "numpy",
    "max",
    "amd-aiter @ git+https://github.com/ROCm/aiter.git",
]
test = [
    "pytest>=8",
    "numpy",
    "amd-aiter @ git+https://github.com/ROCm/aiter.git",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a ROCm HIP device",
]

[tool.setuptools]
packages = ["moonmath_amd"]

[tool.uv.sources]
torch = [{ index = "pytorch-rocm72" }]

[[tool.uv.index]]
name = "pytorch-rocm72"
url = "https://download.pytorch.org/whl/rocm7.2"


# Building needs ROCm PyTorch 2.x and hipcc on PATH.
# torch appears in [build-system].requires so the package builds under
# build isolation (uv resolves it from the pytorch-rocm72 index):
#   uv pip install -e .
# To reuse an installed torch and avoid re-downloading it into the isolated
# build env, pass --no-build-isolation:
#   uv pip install -e . --no-build-isolation
# GPU_ARCHS selects which kernels get built: "native" (default: the GPUs rocminfo lists)
# or an explicit list, e.g. GPU_ARCHS="gfx942;gfx950" uv pip install -e .
